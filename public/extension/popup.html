<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkipMe</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #ff0000, #cc0000);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 11px;
      color: #aaaaaa;
      margin-top: 2px;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .toggle-label {
      font-size: 14px;
      font-weight: 500;
    }

    .toggle {
      position: relative;
      width: 48px;
      height: 26px;
      cursor: pointer;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #3a3a3a;
      border-radius: 26px;
      transition: 0.3s;
    }

    .slider:before {
      content: '';
      position: absolute;
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }

    .toggle input:checked + .slider {
      background: #ff0000;
    }

    .toggle input:checked + .slider:before {
      transform: translateX(22px);
    }

    .stats {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .stats-number {
      font-size: 32px;
      font-weight: 700;
      color: #ff0000;
    }

    .stats-label {
      font-size: 12px;
      color: #aaaaaa;
      margin-top: 4px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 10px;
      background: #1a1a1a;
      border-radius: 8px;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff00;
    }

    .status-dot.disabled {
      background: #ff4444;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 10px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⏭️</div>
    <div>
      <div class="title">SkipMe</div>
      <div class="subtitle">Auto-skip ads instantly</div>
    </div>
  </div>

  <div class="toggle-container">
    <span class="toggle-label">Auto-Skip Ads</span>
    <label class="toggle">
      <input type="checkbox" id="enableToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="stats">
    <div class="stats-number" id="skipCount">0</div>
    <div class="stats-label">Ads Skipped This Session</div>
  </div>

  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Active - Watching for ads...</span>
  </div>

  <div class="footer">
    Works on YouTube.com • No data collected
  </div>

  <script src="popup.js"></script>
</body>
</html>
